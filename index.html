<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DevOps Scroll</title>
  <meta name="description" content="Doomscroll your way through DevOps: learn modules, quiz cards and interview scenarios built around the Memos AWS project." />
  <meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">devops<span>scroll</span></div>
    <div class="toolbar" id="toolbar"></div>
  </header>

  <main>
    <section class="view feed" id="view-learn" data-tab="learn" tabindex="-1" aria-label="Learn"></section>
    <section class="view feed" id="view-quiz" data-tab="quiz" tabindex="-1" aria-label="Quiz" hidden></section>
    <section class="view feed" id="view-scen" data-tab="scen" tabindex="-1" aria-label="Scenarios" hidden></section>
    <section class="view" id="view-news" data-tab="news" aria-label="News" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Sections">
    <button type="button" data-tab="learn"><span class="ti">📚</span><span>Learn</span></button>
    <button type="button" data-tab="quiz"><span class="ti">🧠</span><span>Quiz</span></button>
    <button type="button" data-tab="scen"><span class="ti">🎯</span><span>Scenarios</span></button>
    <button type="button" data-tab="news"><span class="ti">📰</span><span>News</span></button>
  </nav>

  <dialog id="sheet" class="sheet" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle">Modules</h2>
      <button type="button" class="icon-btn" data-close aria-label="Close">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </dialog>

  <script src="data/learn.js"></script>
  <script src="data/quiz.js"></script>
  <script src="data/scenarios.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
